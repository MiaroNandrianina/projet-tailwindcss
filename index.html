<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Document</title>
</head>

<body>
    <header class="w-full mt-8">
        <section class="md:container mx-auto">
            <div class="flex justify-between gap-4 p-8 items-center">
                <div>
                    <img src="./assets/logo-bookmark.svg" alt="">
                </div>

                <div class="md:hidden">
                    <i class="fa-solid fa-bars text-4xl cursor-pointer"></i>
                </div>
                <nav class="hidden md:block">
                    <ul class="list-none flex justify-center gap-8 items-center">
                        <li><a href="" class="text-lg text-slate-950">FEATURES</a></li>
                        <li><a href="" class="text-lg text-slate-950">PRINCING</a></li>
                        <li><a href="" class="text-lg text-slate-950">CONTACT</a></li>
                        <div>
                            <button type="submit"
                                class="w-full py-3 px-6 bg-orange-600 hover:bg-orange-700 text-white font-bold rounded-lg transition duration-200 ease-in-out shadow-lg">
                                LOGIN
                            </button>
                        </div>
                    </ul>
                </nav>
            </div>
        </section>
    </header>
    <!-- ...............................................main.................................................. -->
    <main class="w-full">
        <section class="mt-8">
            <div class="container mx-auto">
                <div class="p-8 flex justify-between items-center flex-col-reverse gap-8 text-center md:flex-row justify-between items-center md:text-left">
                    <div>
                        <h1 class="text-3xl text-black font-bold md:text-5xl">A Simple Bookmark <br class="hidden md:block"> Manager</h1>
                        <p class="text-lg text-slate-950 font-thin py-4">
                            A clean and simple interface to <br class="md:hidden"> organise your favorite websites. <br>Open
                            a new browser tab and see your <br class="md:hidden">
                            sites load instantly.Try it <br> for free
                        </p>
                        <div class="flex justify-center items-center flex-col gap-4 md:flex-row justify-start">
                            <button type="submit" class="flex-1  bg-sky-700 py-4 px-8 rounded-2xl text-white">Get it on
                                Chrome</button>
                            <button type="submit"
                                class="flex-1  bg-neutral-300 py-4 px-8 rounded-2xl text-black font-bold">Get it on
                                Firefox</button>
                        </div>
                    </div>

                    <div class="relative z-10">
                        <img src="./assets/hero-bg.png" alt="">
                    </div>
                </div>
            </div>

            <div class="md:w-2/6 bg-sky-800 h-64 rounded-bl-[80px] rounded-tl-[80px] absolute top-96 right-0 z-0"></div>
        </section>
    </main>
</body>

</html>
